    <script>
      // GitHub Pages deep-link restore: root 404.html redirects /exam/<route> to /exam/?r=<route>.
      (function () {
        var m = location.search.match(/[?&]r=([^&]*)/);
        if (m) history.replaceState(null, '', location.pathname.replace(/\/$/, '') + decodeURIComponent(m[1]));
      })();
    </script>
