<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint so a light-theme user never sees a dark flash.
      (function () {
        try {
          var t = localStorage.getItem('qrs-theme');
          var light = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.classList.toggle('light', light);
        } catch (e) {}
      })();
    </script>
    <script>
      // GitHub Pages deep-link restore: root 404.html redirects /qrcode/<route> to /qrcode/?r=<route>.
      (function () {
        var m = location.search.match(/[?&]r=([^&]*)/);
        if (m) history.replaceState(null, '', location.pathname.replace(/\/$/, '') + decodeURIComponent(m[1]));
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%236366f1'/%3E%3Crect x='20' y='20' width='24' height='24' rx='4' fill='white' fill-opacity='0.9'/%3E%3Crect x='56' y='20' width='24' height='24' rx='4' fill='white' fill-opacity='0.9'/%3E%3Crect x='20' y='56' width='24' height='24' rx='4' fill='white' fill-opacity='0.9'/%3E%3Crect x='60' y='60' width='6' height='6' fill='white' fill-opacity='0.7'/%3E%3Crect x='70' y='60' width='6' height='6' fill='white' fill-opacity='0.7'/%3E%3Crect x='60' y='70' width='6' height='6' fill='white' fill-opacity='0.7'/%3E%3Crect x='70' y='70' width='6' height='6' fill='white' fill-opacity='0.7'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Studio</title>
    <meta name="description" content="Privacy-first QR code generator, scanner and designer. All processing happens locally in your browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-studio-bg text-studio-text font-sans antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
