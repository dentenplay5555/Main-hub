name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        env:
          # Project page lives at https://<user>.github.io/<repo-name>/
          HUB_BASE: /${{ github.event.repository.name }}/
          # Repo variables (Settings → Secrets and variables → Actions → Variables). Not secrets:
          # both end up readable in the built JS anyway. Leave unset until exam login works.
          INCLUDE_EXAM: ${{ vars.INCLUDE_EXAM }}
          INCLUDE_LEARNING: ${{ vars.INCLUDE_LEARNING }}
          INCLUDE_MUSIC: ${{ vars.INCLUDE_MUSIC }}
          INCLUDE_QRCODE: ${{ vars.INCLUDE_QRCODE }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_MUSIC_API_BASE: ${{ vars.VITE_MUSIC_API_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
