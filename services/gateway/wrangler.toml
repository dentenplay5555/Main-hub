name = "dentenplay-gateway"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Keep variables set in the Cloudflare Dashboard (e.g. TEACHER_EMAILS) when deploying from here.
keep_vars = true

[vars]
# Fill in your Supabase project URL, e.g. https://abcdxyz.supabase.co
SUPABASE_URL = "https://uifwhdshcxhqzjhcgzeg.supabase.co"
# Comma-separated. A user whose Google email is outside these domains gets 403.
ALLOWED_EMAIL_DOMAINS = "student.nssc.ac.th,nssc.ac.th"
# Comma-separated origins allowed by CORS. Empty = any origin (safe here: auth is a Bearer token, no cookies).
ALLOWED_ORIGINS = ""
# Body size guard (bytes). Anything larger gets 413.
MAX_BODY_BYTES = "262144"

# Secrets (never commit):
#   TEACHER_EMAILS (teacher email(s), comma-separated; not listed = student): set it in the Cloudflare Dashboard
#   (Workers > dentenplay-gateway > Settings > Variables) or `npx wrangler secret put TEACHER_EMAILS`. Never in this file.
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put SUPABASE_JWT_SECRET      # only if your project still signs with the legacy HS256 secret
