name = "qr-music-api"
main = "src/index.ts"
compatibility_date = "2026-10-22"
compatibility_flags = ["nodejs_compat"]

[vars]
# Not secret, safe to commit.
# Origin used for QR links / CORS when self-hosting on a LAN, e.g. "http://192.168.1.50:5173". Empty = use the page's own origin.
PUBLIC_URL = ""
# Extra origins allowed by CORS (comma-separated), e.g. the GitHub Pages site: "https://<user>.github.io"
ALLOWED_ORIGINS = ""

# Secret (never commit). There is NO default password; admin login is refused until this is set:
#   local dev:  copy .dev.vars.example to .dev.vars and edit it (.dev.vars is git-ignored)
#   deployed:   npx wrangler secret put ADMIN_PASSWORD

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "qr-music-db"
# Placeholder for local dev. Before `wrangler deploy`, create the DB (`npx wrangler d1 create qr-music-db`) and paste its real id here.
database_id = "local-qr-music-db-id"
migrations_dir = "./migrations"

[[durable_objects.bindings]]
name = "ROOM_COORDINATOR"
class_name = "RoomCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomCoordinator"]
